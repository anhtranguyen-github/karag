services:
  backend:
    build:
      context: ./src/backend
    command: /app/.venv/bin/uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    env_file:
      - .env.example
    environment:
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://api.openai.com/v1}
    ports:
      - "8000:8000"
    volumes:
      - ./src/backend:/app
      - backend_venv:/app/.venv
    depends_on:
      - postgres
      - redis
      - qdrant
      - minio
    profiles: [ "cpu" ]

  frontend:
    build:
      context: ./src/frontend
    command: pnpm dev --hostname 0.0.0.0 --port 3000
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8088
      PLATFORM_API_PROXY_TARGET: http://backend:8000
    ports:
      - "3000:3000"
    volumes:
      - ./src/frontend:/app
      - frontend_node_modules:/app/node_modules
    depends_on:
      - backend
    profiles: [ "cpu" ]

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: karag
      POSTGRES_USER: karag
      POSTGRES_PASSWORD: ${DB_PASSWORD:-karag}
    ports:
      - "54321:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    profiles: [ "cpu" ]

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    profiles: [ "cpu" ]

  qdrant:
    image: qdrant/qdrant:v1.13.4
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    profiles: [ "cpu", "plugins" ]

  minio:
    image: minio/minio:RELEASE.2025-02-03T21-03-04Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-minioadmin}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    profiles: [ "cpu", "plugins" ]

  keycloak:
    image: quay.io/keycloak/keycloak:26.1.0
    command: start-dev
    environment:
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
    ports:
      - "8080:8080"
    profiles: [ "cpu" ]

  kong:
    image: kong:3.9
    environment:
      KONG_DATABASE: "off"
      KONG_DECLARATIVE_CONFIG: /kong/declarative/kong.yml
      KONG_PROXY_ACCESS_LOG: /dev/stdout
      KONG_ADMIN_ACCESS_LOG: /dev/stdout
      KONG_PROXY_ERROR_LOG: /dev/stderr
      KONG_ADMIN_ERROR_LOG: /dev/stderr
      KONG_ADMIN_LISTEN: 0.0.0.0:8000
    ports:
      - "8000:8000"
      - "8088:8000"
    volumes:
      - ./deploy/kong/kong.yml:/kong/declarative/kong.yml:ro
    depends_on:
      - backend
      - frontend
    profiles: [ "cpu" ]

  temporal:
    image: temporalio/auto-setup:1.26.2
    environment:
      DB: postgres12
      DB_PORT: 5432
      POSTGRES_USER: karag
      POSTGRES_PWD: ${POSTGRES_PWD}
      POSTGRES_SEEDS: postgres
      DYNAMIC_CONFIG_FILE_PATH: config/dynamicconfig/development-sql.yaml
    ports:
      - "7233:7233"
    volumes:
      - ./deploy/temporal/development-sql.yaml:/etc/temporal/config/dynamicconfig/development-sql.yaml:ro
    depends_on:
      - postgres
    profiles: [ "cpu" ]

  vllm:
    image: vllm/vllm-openai:latest
    command: --model meta-llama/Llama-3.1-8B-Instruct
    ports:
      - "8008:8000"
volumes:
  postgres_data:
  qdrant_data:
  minio_data:
  ollama_data:
  backend_venv:
  frontend_node_modules:
